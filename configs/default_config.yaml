# Default non-secret runtime configuration for MusePilot

models:
  sam:
    model_id: "meta-models/sam-3.1"
    provider: "meta_model_api"
    min_mask_area_px: 64
    max_mask_area_ratio: 0.80
  planner:
    model_id: "meta-models/muse-spark"
    provider: "meta_model_api"
    prompt_file: "prompts/planner_som_v1.txt"
    temperature: 0.1
  verifier:
    model_id: "meta-models/muse-spark-open-1026"
    provider: "partner_inference"
    partner_name: "baseten"
    prompt_file: "prompts/verifier_eval_v1.txt"
    min_roi_pixel_delta: 0.015
    confidence_threshold: 0.80
  voice:
    model_id: "meta-models/muse-voice-transcribe"
    provider: "meta_model_api"

execution:
  display_dpi_scale: 2.0
  max_retries_per_step: 2
  allow_replan_on_obstruction: true
  allowed_operations:
    - "click"
    - "type"
    - "drag"
    - "wait"
    - "verify"
  require_destructive_confirmation: true

telemetry:
  service_name: "musepilot-agent"
  log_level: "INFO"
  log_format: "json"
  redact_sensitive_fields: true

