# Live non-secret runtime defaults for MusePilot.
# Loaded by MusePilotSettings as the lowest-priority layer:
# explicit init > MUSEPILOT_* env vars > .env file > this YAML > built-in defaults.
# Override the file location with MUSEPILOT_CONFIG_YAML_PATH. NEVER put secrets here.
# Note: the action allowlist is a safety invariant hardcoded in the executor,
# not a tunable, so it intentionally lives outside this file.

models:
  sam:
    model_id: "meta-models/sam-3.1"
  planner:
    model_id: "meta-models/muse-spark"
    prompt_file: "prompts/planner_som_v1.txt"
    temperature: 0.1
  verifier:
    model_id: "meta-models/muse-spark-open-1026"
    partner_name: "baseten"
    prompt_file: "prompts/verifier_eval_v1.txt"
    min_roi_pixel_delta: 0.015
    confidence_threshold: 0.80
  voice:
    model_id: "meta-models/muse-voice-transcribe"

execution:
  display_dpi_scale: 2.0
  max_retries_per_step: 2
  allow_replan_on_obstruction: true
  require_destructive_confirmation: true

telemetry:
  log_level: "INFO"
  log_format: "json"
