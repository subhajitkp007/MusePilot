[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musepilot"
version = "0.1.0"
description = "Zero-Coordinate, Visually-Verified Multimodal GUI Agent powered by Meta SAM 3.1, Muse Spark, Muse Spark Open, and Muse Voice Transcribe"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "MusePilot Team" }
]
keywords = ["meta-ai", "sam-3.1", "muse-spark", "gui-agent", "set-of-mark", "multimodal"]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "aiofiles>=23.0.0",
    "websockets>=12.0",
    "meta_sam_parser>=0.1.0",
    "pynput>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
musepilot = "musepilot.cli:main"
musepilot-health = "musepilot.health.checker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["musepilot*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit security checks
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S108", "S603", "S607"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
