<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MusePilot Frontier Target — Pure HTML5 Canvas Simulation Console (0 DOM Controls)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .banner {
      width: 1280px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      border: 1px solid #1f2937;
      padding: 10px 18px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .badge {
      background: #065f46;
      color: #6ee7b7;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    canvas {
      border: 2px solid #334155;
      border-radius: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div>
      <strong>MUSEPILOT FRONTIER TARGET</strong> — Inspect DOM: Only a single <code>&lt;canvas&gt;</code> node exists (Zero Accessibility Tree Nodes)
    </div>
    <div>
      Press <strong>[M]</strong> to toggle live SAM 3.1 Set-of-Mark Overlays • <span class="badge" id="som-indicator">SAM 3.1 SoM: ON</span>
    </div>
  </div>

  <!-- Zero child DOM elements: all controls are rendered purely inside this HTML5 Canvas -->
  <canvas id="frontier-canvas" width="1280" height="720"></canvas>

  <script>
    const canvas = document.getElementById("frontier-canvas");
    const ctx = canvas.getContext("2d");
    const somBadge = document.getElementById("som-indicator");

    let state = {
      sliderPct: 35,
      dampingEnabled: false,
      gainValue: "0.942",
      benchmarkConverged: false,
      showSoM: true,
      activeMask: null,
      verifiedMasks: new Set()
    };

    const masks = [
      { id: 1, x: 100, y: 130, w: 420, h: 64, color: "#38bdf8", label: "Frequency Slider" },
      { id: 2, x: 100, y: 250, w: 280, h: 68, color: "#a855f7", label: "Adaptive Damping" },
      { id: 3, x: 100, y: 375, w: 420, h: 68, color: "#fb923c", label: "Gain Coefficient" },
      { id: 4, x: 100, y: 505, w: 340, h: 76, color: "#34d399", label: "Run Benchmark" }
    ];

    function render() {
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Header inside canvas
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, canvas.width, 58);
      ctx.fillStyle = "#7dd3fc";
      ctx.font = "bold 16px monospace";
      ctx.fillText("WEBGL / CANVAS SIMULATION CALIBRATION ENGINE // ZERO-DOM INTERFACE", 28, 35);

      // Control 1: Frequency Slider
      const m1 = masks[0];
      ctx.fillStyle = "#cbd5e1";
      ctx.font = "14px monospace";
      ctx.fillText(`1. FREQUENCY TARGET SLIDER: ${state.sliderPct}%`, m1.x, m1.y - 10);
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(m1.x, m1.y, m1.w, m1.h);
      ctx.fillStyle = state.sliderPct === 75 ? "#10b981" : "#0284c7";
      ctx.fillRect(m1.x + 6, m1.y + 6, ((m1.w - 12) * state.sliderPct) / 100, m1.h - 12);

      // Control 2: Adaptive Damping Toggle
      const m2 = masks[1];
      ctx.fillStyle = state.dampingEnabled ? "#10b981" : "#334155";
      ctx.fillRect(m2.x, m2.y, m2.w, m2.h);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 15px monospace";
      ctx.fillText(
        `ADAPTIVE DAMPING: ${state.dampingEnabled ? "ENABLED [ON]" : "OFF"}`,
        m2.x + 22,
        m2.y + 40
      );

      // Control 3: Gain Coefficient Input
      const m3 = masks[2];
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(m3.x, m3.y, m3.w, m3.h);
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.strokeRect(m3.x, m3.y, m3.w, m3.h);
      ctx.fillStyle = "#6ee7b7";
      ctx.fillText(`GAIN_COEFF: ${state.gainValue} [LOCKED]`, m3.x + 20, m3.y + 40);

      // Control 4: Run Benchmark Button
      const m4 = masks[3];
      ctx.fillStyle = state.benchmarkConverged ? "#059669" : "#2563eb";
      ctx.fillRect(m4.x, m4.y, m4.w, m4.h);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(
        state.benchmarkConverged ? "BENCHMARK VERIFIED [OK]" : "RUN BENCHMARK SIMULATION",
        m4.x + 32,
        m4.y + 44
      );

      // Right-hand Waveform Viewport
      ctx.fillStyle = "#090d16";
      ctx.fillRect(600, 100, 620, 540);
      ctx.strokeStyle = "#334155";
      ctx.strokeRect(600, 100, 620, 540);
      ctx.fillStyle = state.benchmarkConverged ? "#34d399" : "#facc15";
      ctx.fillText(
        state.benchmarkConverged
          ? "VERIFIER VERDICT: PASS // Q-FACTOR = 99.4% (CONVERGED)"
          : "VERIFIER STATUS: AWAITING CALIBRATION STEPS...",
        630,
        140
      );

      for (let i = 0; i < 12; i++) {
        const bx = 640 + i * 46;
        const bh = state.benchmarkConverged ? 150 + ((i * 37) % 220) : 70 + ((i * 19) % 100);
        ctx.fillStyle = state.benchmarkConverged ? "#10b981" : "#38bdf8";
        ctx.fillRect(bx, 580 - bh, 28, bh);
      }

      // Render SAM 3.1 Set-of-Mark Overlays
      if (state.showSoM) {
        masks.forEach((m) => {
          const isVerified = state.verifiedMasks.has(m.id);
          const stroke = isVerified ? "#22c55e" : m.color;
          ctx.save();
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 3;
          ctx.strokeRect(m.x, m.y, m.w, m.h);

          // Centroid crosshair
          const cx = m.x + m.w / 2;
          const cy = m.y + m.h / 2;
          ctx.beginPath();
          ctx.arc(cx, cy, 5, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.fill();

          // Numbered Badge Pill
          ctx.fillStyle = stroke;
          ctx.fillRect(m.x, m.y - 24, isVerified ? 68 : 42, 22);
          ctx.fillStyle = "#090d16";
          ctx.font = "bold 13px monospace";
          ctx.fillText(isVerified ? `[0${m.id}] OK` : `[0${m.id}]`, m.x + 5, m.y - 8);
          ctx.restore();
        });
      }
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      masks.forEach((m) => {
        if (x >= m.x && x <= m.x + m.w && y >= m.y && y <= m.y + m.h) {
          if (m.id === 1) state.sliderPct = 75;
          if (m.id === 2) state.dampingEnabled = !state.dampingEnabled;
          if (m.id === 3) state.gainValue = "0.942";
          if (m.id === 4) state.benchmarkConverged = true;
          state.verifiedMasks.add(m.id);
          render();
        }
      });
    });

    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "m") {
        state.showSoM = !state.showSoM;
        somBadge.textContent = `SAM 3.1 SoM: ${state.showSoM ? "ON" : "OFF"}`;
        render();
      }
    });

    render();
  </script>
</body>
</html>
