name: MusePilot CI & Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Security Scan & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter & Security Checks
        run: |
          ruff check musepilot tests

      - name: Verify Ruff Formatting
        run: |
          ruff format --check musepilot tests

      - name: Verify Zero-Secrets Hygiene
        run: |
          ! grep -rnE "(sk-[a-zA-Z0-9]{20,}|META_API_KEY=[a-zA-Z0-9_-]{15,})" musepilot/ tests/ docs/ configs/

      - name: Run Pre-Flight Health Check (Simulated Mode)
        run: |
          python -m musepilot.health.checker

      - name: Run Unit & Golden-Trace Fixture Tests
        run: |
          pytest tests/ -v

  flutter-hud:
    name: Flutter HUD Analyze, Test & Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install HUD dependencies
        run: flutter pub get

      - name: Analyze HUD
        run: flutter analyze

      - name: Test HUD
        run: flutter test

      - name: Build HUD web bundle
        run: flutter build web --release

